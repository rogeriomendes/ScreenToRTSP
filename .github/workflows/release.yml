name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispara automaticamente quando uma tag começando com 'v' for criada (ex: v2.0.0)
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub para testar

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest
    permissions:
      contents: write # Necessário para criar a release e fazer upload dos assets

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Executable
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $sourcePath = "bin\Release\net10.0-windows10.0.22621.0\win-x64\publish\ScreenToRTSP.exe"
          
          if (!(Test-Path $sourcePath)) {
            Write-Error "Não foi possível encontrar o executável publicado em $sourcePath"
            exit 1
          }

          # 1. Copia o executável principal com o nome padrão fixo
          Copy-Item -Path $sourcePath -Destination ".\ScreenToRTSP.exe" -Force
          Write-Host "Criado: ScreenToRTSP.exe"

          # 2. Se for disparado por tag de versão, cria também a cópia versionada
          $version = "${{ github.ref_name }}"
          if ($version -like "v*") {
            $versionedName = "ScreenToRTSP-$version.exe"
            Copy-Item -Path $sourcePath -Destination ".\$versionedName" -Force
            Write-Host "Criado: $versionedName"
          }

          # 3. Gera arquivo de checksum SHA-256 para verificação de integridade
          Get-FileHash -Algorithm SHA256 .\ScreenToRTSP*.exe | Format-Table -AutoSize | Out-String | Set-Content -Encoding utf8 ".\checksums.txt"
          Write-Host "Checksums gerados com sucesso:"
          Get-Content ".\checksums.txt"

      # Salva os arquivos como artefato na execução do GitHub Actions (útil para inspeção direta e builds manuais)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScreenToRTSP-binaries
          path: |
            ScreenToRTSP*.exe
            checksums.txt
          if-no-files-found: error

      # Cria a Release oficial no GitHub apenas quando o disparo for uma tag Git (v*)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ScreenToRTSP*.exe
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
