name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispara quando uma tag começando com 'v' for criada (ex: v2.0.0)

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest
    permissions:
      contents: write # Necessário para criar a release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish WinUI 3 App
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true

      - name: Package Release Zip
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "ScreenToRTSP-$version-win-x64.zip"
          $publishDir = "bin\Release\net10.0-windows10.0.22621.0\win-x64\publish"
          
          if (Test-Path "$publishDir\ScreenToRTSP.exe") {
            Compress-Archive -Path "$publishDir\*" -DestinationPath ".\$zipName" -Force
            Write-Host "Pacote $zipName gerado com sucesso."
          } else {
            Write-Error "Não foi possível encontrar o executável publicado em $publishDir"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ScreenToRTSP-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
